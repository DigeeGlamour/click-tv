name: Live Signal Scanner

on:
  schedule:
    # Today Match: প্রতিদিন ২ বার — সকাল ৭:০৭ এবং বিকাল ৫:০৭
    - cron: "7 7,17 * * *"
      timezone: "Asia/Dhaka"

    # Upcoming Match: প্রতি ৬ ঘণ্টা
    - cron: "27 3,9,15,21 * * *"
      timezone: "Asia/Dhaka"

    # TV Channels: প্রতি ৬ ঘণ্টা
    - cron: "17 0,6,12,18 * * *"
      timezone: "Asia/Dhaka"

    # Movies: প্রতি দ্বিতীয় calendar date ভোর ৪:৩৭
    - cron: "37 4 */2 * *"
      timezone: "Asia/Dhaka"

  workflow_dispatch:
    inputs:
      mode:
        description: "Select Scan Mode"
        required: true
        default: "channels"
        type: choice
        options:
          - channels
          - today
          - upcoming
          - movies
          - all

permissions:
  contents: write

concurrency:
  group: live-signal-data-writer
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore scanner source cache
        uses: actions/cache@v4
        with:
          path: working/source-cache
          key: live-signal-source-cache-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            live-signal-source-cache-${{ runner.os }}-${{ github.ref_name }}-
            live-signal-source-cache-${{ runner.os }}-

      - name: Validate scanner files
        shell: bash
        run: |
          set -euo pipefail

          test -f scan.py
          test -f config/settings.json
          test -f config/sources.json
          test -f scanner/content_router.py
          test -f scanner/channel_logos.py
          test -f scanner/fast_pipeline.py
          test -f scanner/source_loader.py
          test -f scanner/normalizer.py
          test -f scanner/planner.py
          test -f scanner/verifier.py
          test -f scanner/bd_verifier.py
          test -f scanner/channels.py
          test -f scanner/movies.py
          test -f manual/movies.txt
          test -f manual/movies.json
          test -f manual/channel-logos.json
          test -f manual/movie-sources.json
          test -f manual/movies-template.txt
          test -f manual/movies-template.json
          test -f state/manual-movie-posters.json
          test -f state/manual-movie-remote-cache.json
          test -f state/channel-logo-cache.json
          test -f tests/test_manual_movies.py
          test -f tests/test_manual_movie_sources.py
          test -f tests/test_channel_logos.py
          test -f scanner/events.py
          test -f scanner/output.py
          test -f scanner/telegram_notify.py

          python -m py_compile scan.py scanner/*.py scanner/parsers/*.py
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Select scan mode
        id: scan_mode
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MODE="${{ inputs.mode }}"
          elif [[ "${{ github.event.schedule }}" == "7 7,17 * * *" ]]; then
            MODE="today"
          elif [[ "${{ github.event.schedule }}" == "27 3,9,15,21 * * *" ]]; then
            MODE="upcoming"
          elif [[ "${{ github.event.schedule }}" == "17 0,6,12,18 * * *" ]]; then
            MODE="channels"
          elif [[ "${{ github.event.schedule }}" == "37 4 */2 * *" ]]; then
            MODE="movies"
          else
            MODE="channels"
          fi

          echo "Selected scan mode: $MODE"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Checkout private movie source repository
        if: steps.scan_mode.outputs.mode == 'movies' || steps.scan_mode.outputs.mode == 'all'
        uses: actions/checkout@v4
        with:
          repository: 0matbank/hopeful-research
          ref: main
          path: working/private-movie-source
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.PRIVATE_MOVIE_SOURCE_TOKEN }}

      - name: Validate private movie source files
        if: steps.scan_mode.outputs.mode == 'movies' || steps.scan_mode.outputs.mode == 'all'
        shell: bash
        run: |
          set -euo pipefail

          test -f working/private-movie-source/categories/Bangla_Movies/bangla_movies.txt
          test -f working/private-movie-source/categories/Hindi_Movies/hindi_movies.txt
          test -f working/private-movie-source/categories/English_Movies/english_movies.txt
          test -f working/private-movie-source/categories/Dubbed/Hindi_Dubbed/hindi_dubbed_movies.txt

      - name: Run scanner
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONFAULTHANDLER: "1"
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
        run: |
          set -euo pipefail

          MODE="${{ steps.scan_mode.outputs.mode }}"
          PRIVATE_MOVIE_SERVER_PID=""

          cleanup_private_movie_server() {
            if [[ -n "$PRIVATE_MOVIE_SERVER_PID" ]]; then
              kill "$PRIVATE_MOVIE_SERVER_PID" 2>/dev/null || true
              wait "$PRIVATE_MOVIE_SERVER_PID" 2>/dev/null || true
            fi
          }

          trap cleanup_private_movie_server EXIT

          if [[ "$MODE" == "movies" || "$MODE" == "all" ]]; then
            python -m http.server 8765 \
              --bind 127.0.0.1 \
              --directory working/private-movie-source \
              >/tmp/click-tv-private-movie-source.log 2>&1 &
            PRIVATE_MOVIE_SERVER_PID="$!"

            for ATTEMPT in {1..15}; do
              if curl --fail --silent \
                http://127.0.0.1:8765/categories/Bangla_Movies/bangla_movies.txt \
                >/dev/null; then
                break
              fi
              sleep 1
            done

            curl --fail --silent --show-error \
              http://127.0.0.1:8765/categories/Bangla_Movies/bangla_movies.txt \
              >/dev/null
          fi

          echo "============================================================"
          echo "LIVE SIGNAL SCANNER STARTED"
          echo "Mode: $MODE"
          echo "Commit: $(git rev-parse --short HEAD)"
          echo "Started: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          python --version
          echo "============================================================"

          python -u scan.py "$MODE" 2>&1 | tee scanner-run.log

          echo "============================================================"
          echo "SCANNER FINISHED"
          echo "Mode: $MODE"
          echo "Finished: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "============================================================"

      - name: Commit and push updated data
        id: git_push
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "Live Signal Scanner"
          git config user.email "scanner@users.noreply.github.com"

          git add data reports state

          if git diff --cached --quiet; then
            echo "No updated output found."
          else
            git commit -m "Auto update: ${{ steps.scan_mode.outputs.mode }} [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]"
          fi

          # Tracked temporary files আগের অবস্থায় ফেরত নেওয়া হবে।
          git restore --worktree -- working || true

          # Untracked temporary checkpoint পরিষ্কার করা হবে।
          rm -f working/pipeline-checkpoint.json
          rm -rf working/checkpoints

          # source-cache delete করা হবে না।
          # .gitignore এটিকে Git থেকে বাদ রাখবে এবং Actions cache সংরক্ষণ করবে।

          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete

          REMAINING="$(git status --porcelain --untracked-files=normal)"

          if [[ -n "$REMAINING" ]]; then
            echo "Unexpected changes remain:"
            echo "$REMAINING"
            exit 1
          fi

          git fetch origin main
          git rebase origin/main

          for ATTEMPT in 1 2 3; do
            if git push origin HEAD:main; then
              break
            fi

            if [[ "$ATTEMPT" == "3" ]]; then
              echo "GitHub push failed after 3 attempts."
              exit 1
            fi

            echo "Push attempt $ATTEMPT failed. Retrying..."
            sleep 5
            git fetch origin main
            git rebase origin/main
          done

          COMMIT="$(git rev-parse --short HEAD)"

          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "GitHub push successful: $COMMIT"

      - name: Send Telegram after successful GitHub push
        if: success()
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -u scanner/telegram_notify.py \
            "${{ steps.scan_mode.outputs.mode }}" \
            "${{ steps.git_push.outputs.commit }}" \
            "main"

      - name: Upload scanner log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-failure-log-${{ github.run_number }}
          path: scanner-run.log
          if-no-files-found: ignore
          retention-days: 3
