name: Movie Discovery Refresh

# Refreshing "what is trending internationally" costs two HTTP requests.
# The full movie scan in scan.yml costs forty minutes, thousands of link
# probes and the private source repository, and runs twice a day at
# "37 4,16 * * *". Tying the first to the second means trending is up to
# twelve hours stale by design.
#
# So this is a separate, deliberately small job. It reads the catalogue the
# last real scan already published, refreshes the TMDB weekly trending
# snapshot, and rebuilds the derived discovery files. It never verifies a
# link, never touches a stream URL and never writes under
# data/movies/<category>/.
#
# THE MOVIE SCAN CADENCE IN scan.yml IS NOT CHANGED BY THIS FILE.

on:
  # UTC, like every cron on this platform. Twice a day, deliberately off the
  # round minutes (the platform's busiest, where scheduled runs get dropped)
  # and well clear of the 04:37 movie scan so the two never contend.
  #
  #   "41 9 * * *"   15:41 Dhaka
  #   "41 21 * * *"  03:41 Dhaka
  schedule:
    - cron: "41 9 * * *"
    - cron: "41 21 * * *"
  workflow_dispatch:
    inputs:
      skip_trending:
        description: "Rebuild derived files only, make no external request"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # Its own queue. This job must never sit behind - or in front of - a
  # 77-minute scan; they write different files and have nothing to wait for
  # in each other. Not cancel-in-progress: a half-written refresh is worse
  # than a late one.
  group: movie-discovery-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Mask provider secrets in all following logs
        shell: bash
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          FANART_API_KEY: ${{ secrets.FANART_API_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          for VALUE in \
            "$TMDB_API_KEY" \
            "$TMDB_API_TOKEN" \
            "$OMDB_API_KEY" \
            "$FANART_API_KEY" \
            "$RAPIDAPI_KEY"; do
            if [[ -n "$VALUE" ]]; then
              echo "::add-mask::$VALUE"
            fi
          done

      - name: Refresh discovery outputs
        id: refresh
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
          # Private credentials come from GitHub Secrets and nowhere else.
          # TVMaze, Cinemeta and AniList are public and need no key.
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          FANART_API_KEY: ${{ secrets.FANART_API_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          RAPIDAPI_MOVIES_HOST: ${{ secrets.RAPIDAPI_MOVIES_HOST }}
        run: |
          set -euo pipefail
          ARGS=""
          if [[ "${{ inputs.skip_trending }}" == "true" ]]; then
            ARGS="--skip-trending"
          fi
          python -u scripts/refresh-movie-discovery.py $ARGS

      - name: Commit refreshed discovery files
        # Only on a successful refresh. A failed run commits nothing, so the
        # discovery JSON already on main stays exactly as it is - which is
        # the whole last-good guarantee, enforced here as well as inside the
        # writers themselves.
        if: steps.refresh.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Live Signal Scanner"
          git config user.email "scanner@users.noreply.github.com"

          # Movie discovery outputs ONLY. Every path here is written by this
          # job; nothing under data/movies/<category>/, data/channels/,
          # data/playback/, today-match.json or upcoming.json can be picked
          # up by an explicit add list, so a refresh can never carry a
          # sports or live-TV change along with it.
          #
          # ONE PATH AT A TIME, AND ONLY IF IT EXISTS. `git add A B C`
          # stages NOTHING and exits 128 when any single path is missing,
          # and several of these are only written when a run actually does
          # that work - a discovery refresh never produces the metadata
          # cache or the identity aliases at all. With `2>/dev/null || true`
          # swallowing both the message and the exit code, the job then
          # reported "No discovery changes to commit" and went green having
          # committed nothing. That is why trending.json never reached
          # production.
          #
          # scan.yml already learned this on the sports side; same guard
          # here. The path list itself is unchanged.
          # Declared once, and used for three things: staging, restoring
          # after a lost push race, and the final check that the commit
          # touches nothing else. One list means those cannot drift apart.
          MOVIE_OUTPUTS=(
            data/movies/discovery
            data/movies/genres
            state/movie-trending-cache.json
            state/provider-health.json
            state/movie-metadata-cache.json
            state/movie-identity-aliases.json
            state/movie-featured-history.json
          )

          stage_movie_outputs() {
            for MOVIE_OUTPUT in "${MOVIE_OUTPUTS[@]}"; do
              if [[ -e "$MOVIE_OUTPUT" ]]; then
                git add -- "$MOVIE_OUTPUT"
              else
                echo "   not produced by this run, skipped: $MOVIE_OUTPUT"
              fi
            done
          }

          # Every path the commit changes must sit inside the allowlist. This
          # is the guarantee that a concurrent sports or live-TV commit can be
          # neither carried along nor reverted, and it is checked rather than
          # assumed - including after the re-apply path below has run.
          assert_scope() {
            # The merge base, never the branch tip. Comparing against
            # origin/main directly would count a concurrent sports commit
            # that this job simply does not have yet as a stray change, and
            # refuse a push that was perfectly in scope.
            BASE="$(git merge-base "$1" HEAD)"
            STRAY=""
            while IFS= read -r CHANGED; do
              [[ -z "$CHANGED" ]] && continue
              INSIDE=0
              for MOVIE_OUTPUT in "${MOVIE_OUTPUTS[@]}"; do
                if [[ "$CHANGED" == "$MOVIE_OUTPUT" || "$CHANGED" == "$MOVIE_OUTPUT"/* ]]; then
                  INSIDE=1
                  break
                fi
              done
              if [[ "$INSIDE" == "0" ]]; then
                STRAY="$STRAY $CHANGED"
              fi
            done < <(git diff --name-only "$BASE" HEAD)
            if [[ -n "$STRAY" ]]; then
              echo "Refusing to push: changes outside the movie discovery allowlist:$STRAY"
              exit 1
            fi
          }

          stage_movie_outputs
          # data/movies/discovery above already covers featured.json and
          # home.json. state/manual-featured.json is deliberately NOT staged:
          # it is operator input, never a job output, so a refresh can never
          # overwrite a pin somebody has just added.

          if git diff --cached --quiet; then
            echo "No discovery changes to commit."
            exit 0
          fi

          echo "Staged for commit:"
          git diff --cached --name-only

          git commit -m "Movie discovery refresh [$(date -u '+%Y-%m-%d %H:%M:%S UTC')]"

          git fetch origin main --quiet
          assert_scope origin/main

          # Losing the push race to the sports scanner is normal here: it
          # commits every few minutes and this job takes longer than that.
          #
          # The old retry ran `git rebase origin/main -X ours` and died on
          # `cannot rebase: You have unstaged changes` every time. The refresh
          # writes more than it publishes - reports/, working/, other state/
          # files - and those stay dirty in the tree after the allowlisted
          # paths are committed, which is a state rebase refuses to start in.
          # So the retry never ran, and a lost race meant the discovery output
          # was simply dropped.
          #
          # `-X ours` was the second bug. During a rebase "ours" is the
          # upstream being replayed onto, not the local work, so on a real
          # conflict that option would have resolved in favour of origin/main
          # and silently discarded the very files this job exists to publish -
          # the opposite of what its own comment claimed.
          #
          # Re-applying replaces both. The outputs are already safe inside
          # this job's commit, so the tree is reset onto the newest main and
          # only the allowlisted paths are restored from that commit. The
          # result is one commit on top of whatever main now holds, whose diff
          # is checked to touch nothing but the allowlist. Concurrent sports
          # work is never overwritten because it is never in the diff, and no
          # force push is involved at any point.
          for ATTEMPT in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Pushed on attempt $ATTEMPT."
              exit 0
            fi
            if [[ "$ATTEMPT" == "3" ]]; then
              echo "Push failed after 3 attempts."
              exit 1
            fi
            echo "Push attempt $ATTEMPT lost the race; re-applying on the latest main."

            OURS="$(git rev-parse HEAD)"
            git fetch origin main --quiet

            # Safe because everything intended is inside $OURS. What this
            # discards is only the unpublished working-tree noise that was
            # blocking the old rebase.
            git reset --hard --quiet origin/main

            for MOVIE_OUTPUT in "${MOVIE_OUTPUTS[@]}"; do
              if git cat-file -e "$OURS:$MOVIE_OUTPUT" 2>/dev/null; then
                git checkout --quiet "$OURS" -- "$MOVIE_OUTPUT"
              else
                echo "   not in this run's commit, skipped: $MOVIE_OUTPUT"
              fi
            done

            stage_movie_outputs
            if git diff --cached --quiet; then
              echo "Latest main already carries this refresh; nothing to push."
              exit 0
            fi
            git commit -q -m "Movie discovery refresh [$(date -u '+%Y-%m-%d %H:%M:%S UTC')]"
            assert_scope origin/main
            echo "Re-applied onto $(git rev-parse --short origin/main); changed:"
            git diff --name-only origin/main HEAD
            sleep 5
          done
