name: Route Renewal

# Re-proves the preferred channel routes before their 14-day proof runs out
# (scripts/renew-proven-routes.py). Same acceptance as a manual run: two
# 120-second sessions in a real browser through the site's own player. A
# route that passes again is renewed; one that fails is left to lapse.

on:
  workflow_dispatch:
  schedule:
    - cron: "20 4 */3 * *"

permissions:
  contents: write

concurrency:
  group: route-renewal
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install browser
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Renew proofs older than 7 days
        run: python scripts/renew-proven-routes.py --due-after-days 7 --vantage github-actions | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit renewed proofs
        run: |
          git add state/route-preference.json state/sustained-playback-proof.json reports/route-renewal-*.json
          if git diff --cached --quiet; then
            echo "Nothing renewed"
            exit 0
          fi
          git config user.name "click-tv-bot"
          git config user.email "click-tv-bot@users.noreply.github.com"
          git commit -m "Renew proven channel routes"
          # The scan commits to main too. On a clashing hunk the renewal wins
          # (rebase -X theirs = the commit being replayed); the rest is theirs.
          for attempt in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep $((attempt * 15))
          done
          exit 1
