name: Playback Feedback Report

on:
  workflow_dispatch:
  schedule:
    - cron: "35 */3 * * *"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download telemetry summary
        env:
          PLAYBACK_TELEMETRY_SUMMARY_URL: ${{ secrets.PLAYBACK_TELEMETRY_SUMMARY_URL }}
          PLAYBACK_TELEMETRY_EXPORT_TOKEN: ${{ secrets.PLAYBACK_TELEMETRY_EXPORT_TOKEN }}
        run: python scripts/fetch-playback-feedback.py

      - name: Commit updated report
        run: |
          if git diff --quiet -- reports/playback-feedback.json; then
            echo "No feedback report changes"
            exit 0
          fi
          git config user.name "click-tv-bot"
          git config user.email "click-tv-bot@users.noreply.github.com"
          git add reports/playback-feedback.json
          git commit -m "Update playback feedback report"
          git push
