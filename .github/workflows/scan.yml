name: Live Signal Scanner

on:
  schedule:
    # Today Match + Upcoming: Every 2 hours
    - cron: "7 */2 * * *"
      timezone: "Asia/Dhaka"

    # Live TV Channels: Every 6 hours
    - cron: "17 */6 * * *"
      timezone: "Asia/Dhaka"

    # Movies VOD: Every second calendar day at 04:27 AM
    - cron: "27 4 */2 * *"
      timezone: "Asia/Dhaka"

  workflow_dispatch:
    inputs:
      mode:
        description: "Select Scan Mode"
        required: true
        default: "channels"
        type: choice
        options:
          - channels
          - events
          - movies
          - today
          - upcoming
          - all

permissions:
  contents: write

concurrency:
  group: live-signal-data-writer
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Select scan mode
        id: scan_mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MODE="${{ inputs.mode }}"
          elif [[ "${{ github.event.schedule }}" == "7 */2 * * *" ]]; then
            MODE="events"
          elif [[ "${{ github.event.schedule }}" == "17 */6 * * *" ]]; then
            MODE="channels"
          elif [[ "${{ github.event.schedule }}" == "27 4 */2 * *" ]]; then
            MODE="movies"
          else
            MODE="channels"
          fi

          if [[ -z "$MODE" ]]; then
            MODE="channels"
          fi

          echo "Event name: ${{ github.event_name }}"
          echo "Manual input mode: ${{ inputs.mode }}"
          echo "Selected scan mode: $MODE"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Run scanner
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "LIVE SIGNAL SCANNER STARTED"
          echo "Selected mode: ${{ steps.scan_mode.outputs.mode }}"
          echo "Commit: $(git rev-parse --short HEAD)"
          python --version
          echo "=========================================="

          python -u scan.py "${{ steps.scan_mode.outputs.mode }}"

      - name: Commit and push updated data
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "Live Signal Scanner"
          git config user.email "scanner@users.noreply.github.com"

          git add data reports state

          if git diff --cached --quiet; then
            echo "No updated data found. Nothing to commit."
            exit 0
          fi

          git commit -m "Auto update: ${{ steps.scan_mode.outputs.mode }} [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]"

          git pull --rebase origin main
          git push origin HEAD:main
