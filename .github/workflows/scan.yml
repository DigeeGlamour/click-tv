name: Live Signal Scanner

on:
  schedule:
    # Today Match: প্রতিদিন ২ বার — সকাল ৭:০৭ এবং বিকাল ৫:০৭
    - cron: "7 7,17 * * *"
      timezone: "Asia/Dhaka"

    # Upcoming Match: প্রতি ৬ ঘণ্টা
    - cron: "27 3,9,15,21 * * *"
      timezone: "Asia/Dhaka"

    # TV Channels: প্রতি ৬ ঘণ্টা
    - cron: "17 0,6,12,18 * * *"
      timezone: "Asia/Dhaka"

    # Movies: প্রতি দ্বিতীয় calendar date ভোর ৪:৩৭
    - cron: "37 4 */2 * *"
      timezone: "Asia/Dhaka"

  workflow_dispatch:
    inputs:
      mode:
        description: "Select Scan Mode"
        required: true
        default: "channels"
        type: choice
        options:
          - channels
          - today
          - upcoming
          - movies
          - all

permissions:
  contents: write

concurrency:
  group: live-signal-data-writer
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore scanner source cache
        uses: actions/cache@v5
        with:
          path: working/source-cache
          key: live-signal-source-cache-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            live-signal-source-cache-${{ runner.os }}-${{ github.ref_name }}-
            live-signal-source-cache-${{ runner.os }}-

      - name: Validate scanner files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            scan.py
            config/settings.json
            config/sources.json
            scanner/content_router.py
            scanner/channel_logos.py
            scanner/fast_pipeline.py
            scanner/source_loader.py
            scanner/normalizer.py
            scanner/planner.py
            scanner/verifier.py
            scanner/bd_verifier.py
            scanner/channels.py
            scanner/movies.py
            scanner/series.py
            scanner/events.py
            scanner/output.py
            scanner/telegram_notify.py
            manual/movies.txt
            manual/movies.json
            manual/channel-logos.json
            manual/movie-sources.json
            manual/movies-template.txt
            manual/movies-template.json
            tests/test_channel_logos.py
            tests/test_content_router.py
            tests/test_fast_pipeline.py
            tests/test_manual_movie_integrity.py
            tests/test_manual_movie_sources.py
            tests/test_manual_movies.py
            tests/test_new_categories.py
            tests/test_planner.py
            tests/test_series.py
            tests/test_series_pipeline.py
          )

          missing=0
          for file in "${required_files[@]}"; do
            if [[ -f "$file" ]]; then
              echo "[OK] $file"
            else
              echo "[MISSING] $file"
              missing=1
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            echo "Scanner validation failed because required scanner source files are missing."
            exit 1
          fi

          # Files under state/ are generated caches. The scanner can recreate them,
          # so a deleted/stale cache must never block a scheduled scan before startup.
          echo "Scanner source-file validation passed."

      - name: Check scanner Python syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scan.py scanner/*.py scanner/parsers/*.py scripts/*.py
          echo "Scanner Python syntax check passed."

      - name: Run scanner unit tests
        shell: bash
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail

          scanner_tests=(
            test_channel_logos.py
            test_content_router.py
            test_fast_pipeline.py
            test_manual_movie_integrity.py
            test_manual_movie_sources.py
            test_manual_movies.py
            test_new_categories.py
            test_planner.py
            test_series.py
            test_series_pipeline.py
          )

          for test_file in "${scanner_tests[@]}"; do
            echo "============================================================"
            echo "RUNNING SCANNER TEST: $test_file"
            echo "============================================================"
            python -m unittest discover -s tests -p "$test_file" -v
          done

          echo "All scanner unit tests passed."

      - name: Select scan mode
        id: scan_mode
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MODE="${{ inputs.mode }}"
          elif [[ "${{ github.event.schedule }}" == "7 7,17 * * *" ]]; then
            MODE="today"
          elif [[ "${{ github.event.schedule }}" == "27 3,9,15,21 * * *" ]]; then
            MODE="upcoming"
          elif [[ "${{ github.event.schedule }}" == "17 0,6,12,18 * * *" ]]; then
            MODE="channels"
          elif [[ "${{ github.event.schedule }}" == "37 4 */2 * *" ]]; then
            MODE="movies"
          else
            MODE="channels"
          fi

          echo "Selected scan mode: $MODE"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Checkout private movie source repository
        if: steps.scan_mode.outputs.mode == 'movies' || steps.scan_mode.outputs.mode == 'all'
        uses: actions/checkout@v5
        with:
          repository: 0matbank/hopeful-research
          ref: main
          path: working/private-movie-source
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.PRIVATE_MOVIE_SOURCE_TOKEN }}

      - name: Validate private movie source repository
        if: steps.scan_mode.outputs.mode == 'movies' || steps.scan_mode.outputs.mode == 'all'
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_ROOT="working/private-movie-source/categories"
          test -d "$SOURCE_ROOT"

          FILE_COUNT="$(find "$SOURCE_ROOT" -type f \
            -iname '*.txt' \
            ! -iname 'history.txt' \
            ! -iname 'readme.txt' \
            ! -name '.*' \
            ! -name '_*' | wc -l | tr -d ' ')"

          if [[ "$FILE_COUNT" -lt 1 ]]; then
            echo "No supported movie source files found under $SOURCE_ROOT"
            exit 1
          fi

          echo "Dynamic movie source discovery found $FILE_COUNT supported file(s)."
          find "$SOURCE_ROOT" -type f \
            -iname '*.txt' \
            ! -iname 'history.txt' \
            ! -iname 'readme.txt' \
            ! -name '.*' \
            ! -name '_*' | sort

      - name: Run scanner
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONFAULTHANDLER: "1"
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
          PRIVATE_MOVIE_SOURCE_TOKEN: ${{ secrets.PRIVATE_MOVIE_SOURCE_TOKEN }}
        run: |
          set -euo pipefail

          MODE="${{ steps.scan_mode.outputs.mode }}"

          echo "============================================================"
          echo "LIVE SIGNAL SCANNER STARTED"
          echo "Mode: $MODE"
          echo "Commit: $(git rev-parse --short HEAD)"
          echo "Started: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          python --version
          echo "============================================================"

          python -u scan.py "$MODE" 2>&1 | tee scanner-run.log

          echo "============================================================"
          echo "SCANNER FINISHED"
          echo "Mode: $MODE"
          echo "Finished: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "============================================================"

      - name: Commit and push updated data
        id: git_push
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "Live Signal Scanner"
          git config user.email "scanner@users.noreply.github.com"

          git add data reports state

          if git diff --cached --quiet; then
            echo "No updated output found."
          else
            git commit -m "Auto update: ${{ steps.scan_mode.outputs.mode }} [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]"
          fi

          # Tracked temporary files আগের অবস্থায় ফেরত নেওয়া হবে।
          git restore --worktree -- working || true

          # Untracked temporary checkpoint পরিষ্কার করা হবে।
          rm -f working/pipeline-checkpoint.json
          rm -rf working/checkpoints

          # source-cache delete করা হবে না।
          # .gitignore এটিকে Git থেকে বাদ রাখবে এবং Actions cache সংরক্ষণ করবে।

          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete

          REMAINING="$(git status --porcelain --untracked-files=normal)"

          if [[ -n "$REMAINING" ]]; then
            echo "Unexpected changes remain:"
            echo "$REMAINING"
            exit 1
          fi

          git fetch origin main
          git rebase origin/main

          for ATTEMPT in 1 2 3; do
            if git push origin HEAD:main; then
              break
            fi

            if [[ "$ATTEMPT" == "3" ]]; then
              echo "GitHub push failed after 3 attempts."
              exit 1
            fi

            echo "Push attempt $ATTEMPT failed. Retrying..."
            sleep 5
            git fetch origin main
            git rebase origin/main
          done

          COMMIT="$(git rev-parse --short HEAD)"

          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "GitHub push successful: $COMMIT"

      - name: Send Telegram after successful GitHub push
        if: success()
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -u scanner/telegram_notify.py \
            "${{ steps.scan_mode.outputs.mode }}" \
            "${{ steps.git_push.outputs.commit }}" \
            "main"

      - name: Upload scanner log on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: scanner-failure-log-${{ github.run_number }}
          path: scanner-run.log
          if-no-files-found: ignore
          retention-days: 3
