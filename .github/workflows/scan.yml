name: Live Signal Scanner

on:
  # EVERY cron below is UTC. GitHub Actions has no timezone for
  # `schedule.cron` - POSIX cron only, always UTC.
  #
  # Each one used to carry an "Asia/Dhaka" timezone key. GitHub's parser
  # accepts an unknown key there and ignores it, so those five lines did
  # nothing at all while reading as though the times were local, and every
  # scan ran six hours earlier in Dhaka than the comment beside it claimed.
  # They are removed rather than corrected, because a key with no effect is
  # worse than no key: it is a claim about behaviour that is not true.
  #
  # What each one actually means, in Dhaka time (UTC+6):
  #
  #   "3,23,43 * * * *"    today match, every 20 min
  #   "1-59/5 * * * *"     upcoming targeted, every 5 min
  #   "9 5,17 * * *"       upcoming full refresh, 11:09 and 23:09 Dhaka
  #   "17 0,6,12,18 * * *" channels, 06:17 / 12:17 / 18:17 / 00:17 Dhaka
  #   "37 4 * * *"         movies, 10:37 Dhaka
  #
  # The two daily ones were written intending 05:09/17:09 and 04:37 DHAKA. The
  # hours are left exactly as they run today, because when a production scan
  # happens is a scheduling decision for the owner, not something to change
  # while fixing a comment. To honour the original intent, subtract six hours:
  # 04:37 Dhaka is "37 22 * * *" UTC.
  #
  # Do not edit the two cron STRINGS "17 0,6,12,18 * * *" or "37 4 * * *"
  # without updating `concurrency.group` below - it matches on them by text to
  # decide which queue a run belongs to.
  schedule:
    # Requirement 4 — Today Match: প্রতি ২০ মিনিট।
    #
    # :03/:23/:43 rather than :00/:20/:40. GitHub runs scheduled workflows on a
    # shared queue and drops what it cannot start, and the round minutes are
    # where every cron on the platform lands at once. Measured on 2026-08-30,
    # the gaps between runs of this workflow were 4, 11, 29, 33, 37, 56, 62,
    # 89, 209 and 246 minutes against crons asking for one every five. Moving
    # off the busiest minute is the one lever available from inside the file.
    - cron: "3,23,43 * * * *"

    # Requirement 4 — Upcoming targeted scan: প্রতি ৫ মিনিটে চলে, কিন্তু
    # scanner শুধু সেই fixture-গুলোর link খোঁজে যেগুলো ১৫ মিনিটের মধ্যে
    # শুরু হবে। বাকি future fixture অযথা scan হয় না।
    #
    # :01/:06/:11/... rather than :00/:05/:10/... - the same reason as above,
    # and this is the one that suffers most, because */5 is the single most
    # contended schedule on GitHub Actions.
    - cron: "1-59/5 * * * *"

    # Upcoming full refresh: দিনে দুবার পুরো fixture তালিকা আনে।
    - cron: "9 5,17 * * *"

    # TV Channels: প্রতি ৬ ঘণ্টা
    - cron: "17 0,6,12,18 * * *"

    # Movies: প্রতি দ্বিতীয় calendar date ভোর ৪:৩৭
    #
    # Was "*/2" - every second calendar DATE, not every second day. A new
    # film waited up to two days to appear, and the gap stretched to three
    # across a month boundary because */2 counts days of the month. The
    # upstream playlist changes daily, so the scan does too.
    - cron: "37 4 * * *"

  workflow_dispatch:
    inputs:
      mode:
        description: "Select Scan Mode"
        required: true
        default: "today"
        type: choice
        options:
          - today
          - upcoming
          - upcoming-targeted
          - channels
          - movies
          - all

permissions:
  contents: write

concurrency:
  # Two queues, split by what a run actually writes, because one queue was
  # starving the scans the site depends on most.
  #
  # A concurrency group holds one run in progress and one pending; every other
  # trigger that arrives is DROPPED, not queued. Runs here take 7 to 77 minutes,
  # and the crons ask for one every five. So a single long movies scan swallowed
  # every event trigger behind it. Measured on 2026-08-30, the real gaps between
  # runs were 122, 79, 44, 229 and 194 minutes against a five-minute cron - and
  # with no scan publishing, Upcoming sat for two hours showing LINK UPDATING on
  # a match that had already kicked off, which is exactly what the owner saw.
  #
  # The split is by file ownership, not by frequency:
  #
  #   events    today, upcoming, upcoming-targeted - all write today-match.json
  #             and upcoming.json, so they must keep sharing one writer.
  #   catalogue channels and movies - long, infrequent, and writing their own
  #             trees under data/channels and data/movies.
  #
  # Both still push to main. That was already handled before this change: the
  # push step fetches, rebases with -X theirs, recomputes every generated count
  # from the file it describes, and retries three times.
  #
  # About the six runs that have sat Queued since 2026-08-05 and 08-11: they are
  # inert, and this is written down so nobody spends another hour on them.
  #
  # They cannot be cancelled - not from CI, and not from the Actions page
  # either, where Cancel returns an error. force-cancel and DELETE both answer
  # 403. GitHub leaves very old queued runs in this state and there is no
  # supported way out of it from here.
  #
  # They also block nothing, which is the part that matters. A concurrency group
  # is evaluated from the workflow file at the commit that triggered the run, and
  # all six were triggered when this file said `group: live-signal-data-writer`.
  # Nothing uses that name any more - current runs are in
  # live-signal-events-v4 and live-signal-catalogue-v4 - so they hold a queue
  # with no traffic in it. Runs since have started and finished normally.
  #
  # Leave them. They cost nothing but a line in the UI.
  group: >-
    live-signal-${{
      (github.event.schedule == '17 0,6,12,18 * * *'
       || github.event.schedule == '37 4 * * *'
       || inputs.mode == 'channels'
       || inputs.mode == 'movies'
       || inputs.mode == 'all')
      && 'catalogue' || 'events'
    }}-v4
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    # Exhaustive mode verifies every unique playback configuration. Large
    # movie catalogues can legitimately take longer than the old 55-minute cap.
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Mask scanner secrets in all following logs
        shell: bash
        env:
          # Keyed route identity. Optional: with no secret set, every keyed
          # field reports `unknown`, which can never hide a channel - so the
          # scanner is weaker without it, never wrong. A key shorter than 16
          # bytes is treated as absent.
          ROUTE_IDENTITY_HMAC_KEY: ${{ secrets.ROUTE_IDENTITY_HMAC_KEY }}
          ROUTE_IDENTITY_HMAC_KEY_ID: ${{ secrets.ROUTE_IDENTITY_HMAC_KEY_ID }}
          PRIVATE_MOVIE_SOURCE_TOKEN: ${{ secrets.PRIVATE_MOVIE_SOURCE_TOKEN }}
          PRIVATE_SPORTS_SOURCE_TOKEN: ${{ secrets.PRIVATE_SPORTS_SOURCE_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
          FANART_API_KEY: ${{ secrets.FANART_API_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          THESPORTSDB_API_KEY: ${{ secrets.THESPORTSDB_API_KEY }}
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          for VALUE in \
            "$PRIVATE_MOVIE_SOURCE_TOKEN" \
            "$PRIVATE_SPORTS_SOURCE_TOKEN" \
            "$TMDB_API_KEY" \
            "$TMDB_API_TOKEN" \
            "$FANART_API_KEY" \
            "$OMDB_API_KEY" \
            "$THESPORTSDB_API_KEY" \
            "$HIGHLIGHTLY_API_KEY" \
            "$SPORTMONKS_API_TOKEN" \
            "$TELEGRAM_BOT_TOKEN" \
            "$TELEGRAM_CHAT_ID"; do
            if [[ -n "$VALUE" ]]; then
              echo "::add-mask::$VALUE"
            fi
          done

      - name: Restore scanner source cache
        uses: actions/cache@v6
        with:
          path: working/source-cache
          key: live-signal-source-cache-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            live-signal-source-cache-${{ runner.os }}-${{ github.ref_name }}-
            live-signal-source-cache-${{ runner.os }}-

      # A published-data check reads what is COMMITTED, and the validation
      # below runs those checks inside a worktree created from HEAD. So one
      # duplicated backup entry left in the tree by an earlier run fails
      # THIS run before its scanner has started - and the scan that would
      # have rewritten that very card never happens. Run #1211 died exactly
      # there, with nothing wrong with the scan it was about to do.
      #
      # So the same reconciliation the push step runs after its rebase is
      # run here, against what was checked out, in --fold-only mode: it
      # touches nothing but a genuinely duplicated route or a link count
      # that no longer matches its own list. It repairs through
      # scanner/unplayable_primary.py, the rule the scan itself applies, so
      # the repair and the next scan cannot disagree about what a duplicate
      # is.
      #
      # Committed, not merely written: the worktree the tests read is built
      # from HEAD, so an uncommitted repair would be invisible to the exact
      # checks it exists to satisfy. With nothing to repair it commits
      # nothing, so an ordinary run gains no commit from this step.
      - name: Repair merge damage in the committed data before validating it
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "Live Signal Scanner"
          git config user.email "scanner@users.noreply.github.com"

          python scripts/reconcile-generated-counts.py --fold-only

          if git diff --quiet -- data/ state/; then
            echo "Nothing to repair; the committed data is self-consistent."
          else
            echo "Repaired before validation:"
            git diff --stat -- data/ state/
            git add data/ state/
            git commit -m "Fold duplicate routes a merge left in the data"
          fi

      - name: Validate scanner files
        shell: bash
        run: |
          set -euo pipefail

          # A bare `test -f` under `set -e` stops at the first missing file and
          # prints nothing but "Process completed with exit code 1", which is how
          # five un-uploaded config/ files cost hours to diagnose. Every required
          # path is checked, every missing one is named, and the failure says what
          # to do about it.
          REQUIRED_FILES=(
            scan.py
            config/settings.json
            config/event-fixtures.json
            config/channel-aliases.json
            config/channel-categories.json
            config/header-profiles.json
            scanner/content_router.py
            scanner/channel_logos.py
            scanner/fast_pipeline.py
            scanner/source_loader.py
            scanner/normalizer.py
            scanner/planner.py
            scanner/verifier.py
            scanner/bd_verifier.py
            scanner/channels.py
            scanner/movies.py
            scanner/series.py
            scanner/channel_resolver.py
            scanner/channel_groups.py
            scanner/event_lifecycle.py
            scanner/streamed_provider.py
            scanner/live_protection.py
            scanner/snapshot_publish.py
            scanner/targeted_scan.py
            manual/movies.txt
            manual/movies.json
            manual/channel-logos.json
            manual/movie-sources.json
            manual/movies-template.txt
            manual/movies-template.json
            state/manual-movie-posters.json
            state/manual-movie-remote-cache.json
            state/channel-logo-cache.json
            tests/test_manual_movies.py
            tests/test_manual_movie_sources.py
            tests/test_series_pipeline.py
            tests/test_final_design_contract.py
            tests/test_channel_logos.py
            tests/test_schedule_resolver.py
            tests/test_sports_channel_system.py
            tests/test_event_fixture_catalogue.py
            scanner/events.py
            scanner/schedule_resolver.py
            scanner/output.py
            scanner/playback_profiles.py
            scanner/telegram_notify.py
            site/index.html
            site/assets/css/final-design.css
            site/assets/css/embed-player.css
            site/assets/js/app.js
            site/assets/js/series.js
            site/sw.js
            data/playback-sources.json
            .gitattributes
            config/sources/today-match.json
            config/sources/upcoming.json
            config/sources/tv.json
            config/sources/movies.json
            config/sources/manual.json
          )

          MISSING=()
          for REQUIRED in "${REQUIRED_FILES[@]}"; do
            if [[ ! -f "$REQUIRED" ]]; then
              MISSING+=("$REQUIRED")
            fi
          done

          if (( ${#MISSING[@]} > 0 )); then
            echo "::error title=Required files are missing from the repository::${#MISSING[@]} file(s) not found"
            for GONE in "${MISSING[@]}"; do
              echo "  MISSING  $GONE"
              echo "::error file=$GONE::$GONE is required by the scanner but is not in the repository"
            done
            echo ""
            echo "These files exist locally but were never uploaded, or were deleted."
            echo "Upload them and re-run. Never delete config/sources.json."
            exit 1
          fi

          echo "All ${#REQUIRED_FILES[@]} required files present."

          python - <<'PY'
          from pathlib import Path

          bad = [
              path.as_posix()
              for path in Path(".").rglob("*.sh")
              if ".git" not in path.parts and b"\r" in path.read_bytes()
          ]
          if bad:
              raise SystemExit("Shell scripts must use LF line endings: " + ", ".join(bad))
          PY

          python -m py_compile scan.py scanner/*.py scanner/parsers/*.py scripts/*.py tests/*.py
          node --check site/assets/js/app.js
          node --check site/assets/js/series.js
          node --check site/sw.js
          node tests/playback-worker-runtime.mjs
          # The suite runs in a throwaway worktree, not in the tree the scanner
          # is about to read. A worktree shares the object database, so this
          # costs a checkout and no clone, and whatever the tests write is
          # thrown away with it. Isolating the tests themselves is thirty call
          # sites and belongs in its own commit; this makes the damage
          # impossible in the meantime, which the discard below could only undo
          # after the fact.
          VALIDATE_TREE="${RUNNER_TEMP:-/tmp}/clicktv-validate-$$"
          git worktree add --detach --quiet "$VALIDATE_TREE" HEAD
          set +e
          # The worktree stops every module that resolves state/ and
          # reports/ against the working directory. Nine of them do not:
          # their default path is anchored to __file__, so it names THIS
          # checkout however the suite is started, and
          # state/route-persistence.json - the 13,736-line casualty above -
          # is one of the nine. These two variables point them at the
          # worktree's own copies: the same committed content the tests
          # expect to read, thrown away with the tree afterwards. Unset,
          # they change nothing. See scanner/paths.py.
          (
            cd "$VALIDATE_TREE" \
              && CLICKTV_STATE_ROOT="$VALIDATE_TREE/state" \
                 CLICKTV_REPORTS_ROOT="$VALIDATE_TREE/reports" \
                 python -m unittest discover -s tests -p "test_*.py" -v
          )
          VALIDATE_STATUS=$?
          set -e
          git worktree remove --force "$VALIDATE_TREE" || rm -rf "$VALIDATE_TREE"
          if [[ "$VALIDATE_STATUS" -ne 0 ]]; then exit "$VALIDATE_STATUS"; fi

          # The suite writes into the repository's REAL state/ and reports/.
          # Around thirty tests across test_model_enforcement,
          # test_visibility_audit, test_evidence_ordering, test_manual_movies
          # and others call the persistence helpers on their default paths, and
          # those default to the working tree.
          #
          # It is not cosmetic. Measured on 2026-08-29: one suite run left
          # state/route-persistence.json 13,736 lines shorter - the ledger that
          # holds per-route observation history, and the whole reason a channel
          # is not given up on after one bad answer. Because this step runs
          # before the scanner, every run since the suite grew has started from
          # an emptied ledger and then committed it: 497 KB at 150d3487c, 22 KB
          # three commits later, 216 KB at 3796cd144, 23 KB at 71fda2082.
          #
          # Belt and braces. The worktree above is the actual fix - the tests
          # can no longer reach this tree at all. This stays because a later
          # step could still touch these files, and restoring a clean tree
          # costs nothing.
          echo "Discarding test-run churn in state/ and reports/ before scanning:"
          git status --porcelain -- state reports | head -40
          git checkout -- state reports
          git status --porcelain -- state reports

      - name: Select scan mode
        id: scan_mode
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MODE="${{ inputs.mode }}"
          elif [[ "${{ github.event.schedule }}" == "0,20,40 * * * *" ]]; then
            MODE="today"
          elif [[ "${{ github.event.schedule }}" == "*/5 * * * *" ]]; then
            MODE="upcoming-targeted"
          elif [[ "${{ github.event.schedule }}" == "9 5,17 * * *" ]]; then
            MODE="upcoming"
          elif [[ "${{ github.event.schedule }}" == "17 0,6,12,18 * * *" ]]; then
            MODE="channels"
          elif [[ "${{ github.event.schedule }}" == "37 4 * * *" ]]; then
            MODE="movies"
          else
            MODE="channels"
          fi

          echo "Selected scan mode: $MODE"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      # Five crons ask for roughly 370 runs a day. GitHub delivered ten on
      # 2026-08-27, nine on 08-28 and nine on 08-29, against ninety-five on
      # 08-22. That is documented GitHub behaviour - a schedule event is
      # delayed under load and skipped once the delay reaches the next
      # occurrence, and `*/5` puts the next occurrence five minutes away - and
      # nothing here can change it.
      #
      # What it can change is what the surviving runs do. The dense crons win
      # the few slots, so on 2026-08-29 the channels catalogue was sixteen
      # hours stale and the movie catalogue forty-seven, both still published.
      # This step lets a surviving run also scan whichever catalogue mode is
      # overdue. It adds; it never replaces, and never more than one per run.
      - name: Plan a catch-up for a catalogue the schedule skipped
        id: catchup
        shell: bash
        run: |
          set -euo pipefail

          # Freshness has to be read from origin/main too, not only from
          # what this run happens to have checked out. Once channels
          # crosses its 9 h limit, EVERY run created before the first
          # catch-up manages to push still sees the old summary in its own
          # checkout and plans the same catch-up - and with a five-minute
          # cron against a ~15 min channels scan that is three or more runs
          # scanning channels at once. Each then commits a whole
          # independently regenerated catalogue and reconciles it with
          # `rebase -X theirs`, which is where a text merge duplicates
          # entries inside one card. Measured: channels commits at 21:18
          # and 21:35, then again at 04:51 and 04:56, against a cron that
          # asks for one every six hours.
          #
          # Best effort by design. A failed fetch, a summary that is not on
          # the remote yet, or a first run on a new branch leaves the local
          # answer in place - which is what this did before.
          REMOTE_REPORTS="${RUNNER_TEMP:-/tmp}/origin-reports"
          mkdir -p "$REMOTE_REPORTS"
          if git fetch --quiet origin main 2>/dev/null; then
            for CATALOGUE in channels movies; do
              git show "origin/main:reports/scan-summary-$CATALOGUE.json" > "$REMOTE_REPORTS/scan-summary-$CATALOGUE.json" 2>/dev/null || rm -f "$REMOTE_REPORTS/scan-summary-$CATALOGUE.json"
            done
          fi
          python scripts/select-scan-mode.py \
            --scheduled "${{ steps.scan_mode.outputs.mode }}" \
            --event-name "${{ github.event_name }}" \
            --remote-reports-dir "$REMOTE_REPORTS" \
            > /dev/null

      # A run that waited out its own cadence has nothing useful left to write,
      # and finishing it holds the queue against the next one.
      #
      # Measured on 2026-08-28: a today-match run created at 06:53 started at
      # 07:43 - fifty minutes late - while the cron asks for one every twenty
      # minutes. The concurrency group is deliberately one-writer with
      # cancel-in-progress false, so slow runs stack rather than replace each
      # other, and six workflow_dispatch runs have been queued since 2026-08-05
      # and 08-11 and cannot be cancelled from here.
      #
      # Only the two frequent modes are dropped, and only when they are already
      # past their own interval. channels, movies and the twice-daily upcoming
      # refresh always run: they are infrequent, they are the ones that publish
      # the catalogue, and a late one is still worth having.
      - name: Skip a superseded run of a frequent mode
        id: staleness
        if: github.event_name == 'schedule'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail

          MODE="${{ steps.scan_mode.outputs.mode }}"
          case "$MODE" in
            today) LIMIT=1500 ;;             # 25 min, cadence is 20
            upcoming-targeted) LIMIT=720 ;;  # 12 min, cadence is 5
            *) echo "mode $MODE always runs"; echo "stale=no" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac

          CREATED="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --jq .created_at 2>/dev/null || true)"
          if [[ -z "$CREATED" ]]; then
            echo "run creation time unavailable; running anyway"
            echo "stale=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CREATED_TS="$(date -u -d "$CREATED" +%s 2>/dev/null || echo 0)"
          NOW_TS="$(date -u +%s)"
          if [[ "$CREATED_TS" -eq 0 ]]; then
            echo "could not parse $CREATED; running anyway"
            echo "stale=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          AGE=$(( NOW_TS - CREATED_TS ))
          echo "mode=$MODE queued_age=${AGE}s limit=${LIMIT}s"
          if [[ "$AGE" -gt "$LIMIT" ]]; then
            echo "This $MODE run is ${AGE}s old and superseded; skipping the scan."
            echo "stale=yes" >> "$GITHUB_OUTPUT"
          else
            echo "stale=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout private movie source repository
        # The catch-up counts too: a movies catch-up that ran without the
        # private source would scan the public playlists alone and
        # rebuild the catalogue from a fraction of its candidates.
        if: >-
          steps.scan_mode.outputs.mode == 'movies'
          || steps.scan_mode.outputs.mode == 'all'
          || steps.catchup.outputs.catchup == 'movies'
        uses: actions/checkout@v7
        with:
          repository: 0matbank/hopeful-research
          ref: main
          path: working/private-movie-source
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.PRIVATE_MOVIE_SOURCE_TOKEN }}

      - name: Validate private movie source repository
        # The catch-up counts too: a movies catch-up that ran without the
        # private source would scan the public playlists alone and
        # rebuild the catalogue from a fraction of its candidates.
        if: >-
          steps.scan_mode.outputs.mode == 'movies'
          || steps.scan_mode.outputs.mode == 'all'
          || steps.catchup.outputs.catchup == 'movies'
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_ROOT="working/private-movie-source/categories"
          test -d "$SOURCE_ROOT"

          FILE_COUNT="$(find "$SOURCE_ROOT" -type f \
            -iname '*.txt' \
            ! -iname 'history.txt' \
            ! -iname 'readme.txt' \
            ! -name '.*' \
            ! -name '_*' | wc -l | tr -d ' ')"

          if [[ "$FILE_COUNT" -lt 1 ]]; then
            echo "No supported movie source files found under $SOURCE_ROOT"
            exit 1
          fi

          echo "Dynamic movie source discovery found $FILE_COUNT supported file(s)."
          find "$SOURCE_ROOT" -type f \
            -iname '*.txt' \
            ! -iname 'history.txt' \
            ! -iname 'readme.txt' \
            ! -name '.*' \
            ! -name '_*' | sort

      - name: Run scanner
        # A superseded frequent run still runs when it carries a catch-up: the
        # scheduled today-match pass is what is stale, not the channels
        # catalogue the run was about to rescue.
        if: steps.staleness.outputs.stale != 'yes' || steps.catchup.outputs.catchup != ''
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONFAULTHANDLER: "1"
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
          # Keyed route identity. Optional: with no secret set, every keyed
          # field reports `unknown`, which can never hide a channel - so the
          # scanner is weaker without it, never wrong. A key shorter than 16
          # bytes is treated as absent.
          ROUTE_IDENTITY_HMAC_KEY: ${{ secrets.ROUTE_IDENTITY_HMAC_KEY }}
          ROUTE_IDENTITY_HMAC_KEY_ID: ${{ secrets.ROUTE_IDENTITY_HMAC_KEY_ID }}
          PRIVATE_MOVIE_SOURCE_TOKEN: ${{ secrets.PRIVATE_MOVIE_SOURCE_TOKEN }}
          PRIVATE_SPORTS_SOURCE_TOKEN: ${{ secrets.PRIVATE_SPORTS_SOURCE_TOKEN }}
          FANART_API_KEY: ${{ secrets.FANART_API_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          THESPORTSDB_API_KEY: ${{ secrets.THESPORTSDB_API_KEY }}
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
        run: |
          set -euo pipefail

          MODE="${{ steps.scan_mode.outputs.mode }}"
          CATCHUP="${{ steps.catchup.outputs.catchup }}"
          STALE="${{ steps.staleness.outputs.stale }}"

          echo "============================================================"
          echo "LIVE SIGNAL SCANNER STARTED"
          echo "Mode: $MODE"
          echo "Catch-up: ${CATCHUP:-none}"
          echo "Commit: $(git rev-parse --short HEAD)"
          echo "Started: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          python --version
          echo "============================================================"

          # The overdue catalogue first. It is the one the schedule dropped,
          # so if the job is going to run out of time it should not be the
          # thing that loses.
          if [[ -n "$CATCHUP" ]]; then
            echo "--- catch-up scan: $CATCHUP ---"
            python -u scan.py "$CATCHUP" 2>&1 | tee scanner-run.log
          fi

          if [[ "$STALE" == "yes" ]]; then
            echo "--- scheduled $MODE pass skipped: superseded ---"
          elif [[ -n "$CATCHUP" ]]; then
            python -u scan.py "$MODE" 2>&1 | tee -a scanner-run.log
          else
            python -u scan.py "$MODE" 2>&1 | tee scanner-run.log
          fi

          echo "============================================================"
          echo "SCANNER FINISHED"
          echo "Mode: $MODE"
          echo "Catch-up: ${CATCHUP:-none}"
          echo "Finished: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "============================================================"

      # Ask the live playback proxies for every route this scan is about to
      # publish, with the site origin, exactly as the player does. The scanner
      # verifies with Python's own socket from this runner; the viewer fetches
      # through a Cloudflare Worker from a browser. A route can answer 200 to
      # the first and be unreachable to the second, and that publishes a card
      # that spins forever.
      #
      # A permanent refusal is written to state/measured-playback-failures.json,
      # which the merger ranks above every other signal - so the next scan
      # prefers an alternate the sources already carry, without anyone asking.
      # That is the whole self-repair loop, and it needs no service to run.
      #
      # Never fails the run. This is evidence gathering; if the proxies are
      # having a bad minute the right outcome is to publish what the scan found
      # and record nothing, which is exactly what the script does with an
      # ambiguous answer.
      - name: Check the delivery path a viewer actually uses
        if: steps.staleness.outputs.stale != 'yes' || steps.catchup.outputs.catchup != ''
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          python -u scripts/verify-delivery-path.py --workers 8 --timeout 20             2>&1 | tail -40

      - name: Validate generated Cloudflare Pages output
        if: steps.staleness.outputs.stale != 'yes' || steps.catchup.outputs.catchup != ''
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-pages.sh

      - name: Commit and push updated data
        if: steps.staleness.outputs.stale != 'yes' || steps.catchup.outputs.catchup != ''
        id: git_push
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "Live Signal Scanner"
          git config user.email "scanner@users.noreply.github.com"

          git add data reports state

          if git diff --cached --quiet; then
            echo "No updated output found."
          else
            git commit -m "Auto update: ${{ steps.scan_mode.outputs.mode }} [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]"
          fi

          # Generated output is safely stored in the commit above. Remove every
          # uncommitted scanner/test mutation before rebase; the commit remains.
          git restore --staged --worktree -- .

          # Untracked temporary checkpoint পরিষ্কার করা হবে।
          rm -f working/pipeline-checkpoint.json
          rm -f working/scan-progress.json
          rm -rf working/checkpoints

          # source-cache delete করা হবে না।
          # .gitignore এটিকে Git থেকে বাদ রাখবে এবং Actions cache সংরক্ষণ করবে।

          # __pycache__/pyc .gitignore-এ আছে। এগুলো delete করলে পুরোনো
          # repository-তে ভুল করে tracked থাকা cache D status তৈরি করত।

          # CLICK_TV_EASY_PAT_SCAN.cmd and the .ps1 helpers were committed with
          # CRLF bytes in the blob, while .gitattributes declares `eol=crlf`.
          # Git then reports them modified forever: checkout writes CRLF back,
          # the clean filter normalises that to LF, and LF never matches the
          # stored CRLF blob. `git restore` cannot fix it and neither can
          # stashing, so the rebase below refused to start on every single run.
          # Renormalising and committing once rewrites those blobs with LF. The
          # files on disk stay CRLF for Windows, and later runs find nothing to
          # do, so this repairs itself exactly once.
          git add --renormalize -- .

          if ! git diff --cached --quiet --ignore-cr-at-eol; then
            echo "Unexpected content changes remain:"
            git diff --cached --stat
            exit 1
          fi

          if ! git diff --cached --quiet; then
            echo "Normalizing line endings for eol=crlf helper scripts."
            git diff --cached --name-only
            git commit -m "Normalize line endings for eol=crlf helper scripts"
          fi

          REMAINING="$(git status --porcelain --untracked-files=normal)"

          if [[ -n "$REMAINING" ]]; then
            echo "Unexpected changes remain:"
            echo "$REMAINING"
            git diff --stat
            exit 1
          fi

          # Two scan modes can be in flight at once (today at :47, upcoming at
          # :39 and so on). Both rewrite whole machine-generated JSON files, so
          # a plain rebase hits "CONFLICT in state/stream-history.json" and the
          # run dies with the data already committed but never pushed.
          # A 3-way text merge of regenerated JSON is meaningless; the newer
          # scan result is simply the correct one. `-X theirs` resolves exactly
          # those conflicting files in favour of the commit being replayed and
          # leaves every file the other run touched alone.
          reconcile_generated_counts() {
            # A rebase can auto-merge a large collection (channel list,
            # playback-sources records) from both sides while resolving the
            # single scalar count describing it in favour of only one side.
            # The collection and its declared count then disagree, and the
            # Pages validator rightly refuses to publish. Recompute every
            # count from the file it actually describes, right after the
            # rebase that could have introduced the drift.
            "$PYTHON_BIN" scripts/reconcile-generated-counts.py
            # state/ as well as data/. The same rebase merges
            # state/last-good/<slug>.json, which the commit above already
            # staged, and that file is what sudden-drop protection restores
            # a category FROM - so a repair applied only to data/ would ship
            # beside an unrepaired restore source and come straight back the
            # next time a category is preserved.
            if ! git diff --quiet -- data/ state/; then
              git add data/ state/
              git commit --amend --no-edit
            fi
          }

          PYTHON_BIN="$(command -v python3 || command -v python)"
          git fetch origin main
          git rebase -X theirs origin/main
          reconcile_generated_counts

          for ATTEMPT in 1 2 3; do
            if git push origin HEAD:main; then
              break
            fi

            if [[ "$ATTEMPT" == "3" ]]; then
              echo "GitHub push failed after 3 attempts."
              exit 1
            fi

            echo "Push attempt $ATTEMPT failed. Retrying..."
            sleep 5
            git fetch origin main
            git rebase -X theirs origin/main
            reconcile_generated_counts
          done

          COMMIT="$(git rev-parse --short HEAD)"

          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "GitHub push successful: $COMMIT"

      - name: Send Telegram after successful GitHub push
        if: success() && steps.staleness.outputs.stale != 'yes'
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -u scanner/telegram_notify.py \
            "${{ steps.scan_mode.outputs.mode }}" \
            "${{ steps.git_push.outputs.commit }}" \
            "main"

      - name: Send Telegram after failed scan or push
        if: failure()
        continue-on-error: true
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MODE="${{ steps.scan_mode.outputs.mode }}"
          if [[ -z "$MODE" ]]; then MODE="unknown"; fi
          python -u scanner/telegram_notify.py \
            "$MODE" \
            "${{ github.sha }}" \
            "${{ github.ref_name }}" \
            --failure \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Upload scanner log on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: scanner-failure-log-${{ github.run_number }}
          path: scanner-run.log
          if-no-files-found: ignore
          retention-days: 3
