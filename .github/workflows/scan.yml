name: Live Signal Scanner

on:
  schedule:
    # Today Match + Upcoming: প্রতি ২ ঘণ্টা
    - cron: "7 */2 * * *"
      timezone: "Asia/Dhaka"

    # Fast TV channel health scan: প্রতি ৬ ঘণ্টা
    - cron: "17 */6 * * *"
      timezone: "Asia/Dhaka"

    # Deeper TV discovery scan: প্রতিদিন রাত ৩:৩৭
    - cron: "37 3 * * *"
      timezone: "Asia/Dhaka"

    # Movies scan: প্রতি দ্বিতীয় calendar date ভোর ৪:২৭
    - cron: "27 4 */2 * *"
      timezone: "Asia/Dhaka"

  workflow_dispatch:
    inputs:
      mode:
        description: "Select Scan Mode"
        required: true
        default: "channels"
        type: choice
        options:
          - channels
          - channels-discovery
          - events
          - today
          - upcoming
          - movies
          - movies-discovery
          - all
          - full-audit

permissions:
  contents: write

concurrency:
  group: live-signal-data-writer
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore scanner source cache
        uses: actions/cache@v4
        with:
          path: working/source-cache
          key: live-signal-source-cache-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            live-signal-source-cache-${{ runner.os }}-${{ github.ref_name }}-
            live-signal-source-cache-${{ runner.os }}-

      - name: Validate advanced scanner files
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking required advanced scanner files..."

          test -f scan.py
          test -f requirements.txt
          test -f config/settings.json
          test -f config/sources.json

          test -f scanner/content_router.py
          test -f scanner/fast_pipeline.py
          test -f scanner/source_loader.py
          test -f scanner/normalizer.py
          test -f scanner/planner.py
          test -f scanner/verifier.py
          test -f scanner/bd_verifier.py
          test -f scanner/channels.py
          test -f scanner/movies.py
          test -f scanner/events.py
          test -f scanner/output.py

          python -m py_compile \
            scan.py \
            scanner/*.py \
            scanner/parsers/*.py

          python - <<'PY'
          from scanner.content_router import route_candidate
          from scanner.fast_pipeline import run_fast_verification_pipeline
          from scanner.channels import process_tv_channels
          from scanner.movies import process_movies
          from scanner.events import process_events
          from scanner.output import publish_scan_outputs

          print("Advanced scanner imports succeeded.")
          print("Scanner preflight validation passed.")
          PY

      - name: Run automated scanner tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Select scan mode
        id: scan_mode
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MODE="${{ inputs.mode }}"
          elif [[ "${{ github.event.schedule }}" == "7 */2 * * *" ]]; then
            MODE="events"
          elif [[ "${{ github.event.schedule }}" == "17 */6 * * *" ]]; then
            MODE="channels"
          elif [[ "${{ github.event.schedule }}" == "37 3 * * *" ]]; then
            MODE="channels-discovery"
          elif [[ "${{ github.event.schedule }}" == "27 4 */2 * *" ]]; then
            MODE="movies"
          else
            MODE="channels"
          fi

          echo "GitHub event: ${{ github.event_name }}"
          echo "Selected scan mode: $MODE"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Run scanner
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONFAULTHANDLER: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          MODE="${{ steps.scan_mode.outputs.mode }}"

          echo "============================================================"
          echo "LIVE SIGNAL ADVANCED SCANNER STARTED"
          echo "Mode: $MODE"
          echo "Commit: $(git rev-parse --short HEAD)"
          echo "Started: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          python --version
          echo "============================================================"

          python -u scan.py "$MODE" 2>&1 | tee scanner-run.log

          echo "============================================================"
          echo "LIVE SIGNAL ADVANCED SCANNER FINISHED"
          echo "Mode: $MODE"
          echo "Finished: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "============================================================"

      - name: Commit and push updated data
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "Live Signal Scanner"
          git config user.email "scanner@users.noreply.github.com"

          git add data reports state

          if git diff --cached --quiet; then
            echo "No updated public data found. Nothing to commit."
            exit 0
          fi

          git commit -m "Auto update: ${{ steps.scan_mode.outputs.mode }} [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]"

          # Temporary scanner output must not block rebase/push.
          git restore --worktree -- working || true
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name "*.pyc" -delete

          REMAINING="$(git status --porcelain --untracked-files=normal)"
          if [[ -n "$REMAINING" ]]; then
            echo "Unexpected non-output changes remain:"
            echo "$REMAINING"
            exit 1
          fi

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Upload scanner log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-failure-log-${{ github.run_number }}
          path: scanner-run.log
          if-no-files-found: ignore
          retention-days: 3
