name: Live Signal Scanner

on:
  schedule:
    # Today Match + Upcoming: Every 30 minutes
    - cron: "7,37 * * * *"
      timezone: "Asia/Dhaka"

    # Live TV Channels: Every 3 hours
    - cron: "17 */3 * * *"
      timezone: "Asia/Dhaka"

    # Movies VOD: Every day at 04:27 AM
    - cron: "27 4 * * *"
      timezone: "Asia/Dhaka"

  workflow_dispatch:
    inputs:
      mode:
        description: "Select Scan Mode"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - events
          - channels
          - movies
          - today
          - upcoming

permissions:
  contents: write

concurrency:
  group: live-signal-data-writer
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
  uses: actions/checkout@v4
  with:
    fetch-depth: 0
    persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Select scan mode
        id: scan_mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MODE="${{ inputs.mode }}"
          elif [[ "${{ github.event.schedule }}" == "7,37 * * * *" ]]; then
            MODE="events"
          elif [[ "${{ github.event.schedule }}" == "17 */3 * * *" ]]; then
            MODE="channels"
          elif [[ "${{ github.event.schedule }}" == "27 4 * * *" ]]; then
            MODE="movies"
          else
            MODE="all"
          fi

          echo "Selected mode: $MODE"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scan.py "${{ steps.scan_mode.outputs.mode }}"

      - name: Commit and push updated data
        shell: bash
        run: |
          git config user.name "Live Signal Scanner"
          git config user.email "scanner@users.noreply.github.com"

          git add data reports state

          if git diff --cached --quiet; then
            echo "No changes found to commit."
            exit 0
          fi

          git commit -m "Auto update: ${{ steps.scan_mode.outputs.mode }} [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]"

          git fetch origin scanner-v2
          git rebase origin/scanner-v2
          git push origin HEAD:scanner-v2
