name: Live Signal Scanner

on:
  schedule:
    # Today Match + Upcoming: প্রতি ২ ঘণ্টা
    - cron: "7 */2 * * *"
      timezone: "Asia/Dhaka"

    # TV Channels: প্রতি ৬ ঘণ্টা
    - cron: "17 */6 * * *"
      timezone: "Asia/Dhaka"

    # Movies: প্রতি দ্বিতীয় calendar date ভোর ৪:২৭
    - cron: "27 4 */2 * *"
      timezone: "Asia/Dhaka"

  workflow_dispatch:
    inputs:
      mode:
        description: "Select Scan Mode"
        required: true
        default: "channels"
        type: choice
        options:
          - channels
          - events
          - movies

permissions:
  contents: write

concurrency:
  group: live-signal-data-writer
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore scanner source cache
        uses: actions/cache@v4
        with:
          path: working/source-cache
          key: live-signal-source-cache-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            live-signal-source-cache-${{ runner.os }}-${{ github.ref_name }}-
            live-signal-source-cache-${{ runner.os }}-

      - name: Validate scanner files
        shell: bash
        run: |
          set -euo pipefail

          test -f scan.py
          test -f config/settings.json
          test -f config/sources.json
          test -f scanner/content_router.py
          test -f scanner/fast_pipeline.py
          test -f scanner/source_loader.py
          test -f scanner/normalizer.py
          test -f scanner/planner.py
          test -f scanner/verifier.py
          test -f scanner/bd_verifier.py
          test -f scanner/channels.py
          test -f scanner/movies.py
          test -f scanner/events.py
          test -f scanner/output.py
          test -f scanner/telegram_notify.py

          python -m py_compile scan.py scanner/*.py scanner/parsers/*.py
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Select scan mode
        id: scan_mode
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MODE="${{ inputs.mode }}"
          elif [[ "${{ github.event.schedule }}" == "7 */2 * * *" ]]; then
            MODE="events"
          elif [[ "${{ github.event.schedule }}" == "17 */6 * * *" ]]; then
            MODE="channels"
          elif [[ "${{ github.event.schedule }}" == "27 4 */2 * *" ]]; then
            MODE="movies"
          else
            MODE="channels"
          fi

          echo "Selected scan mode: $MODE"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Run scanner
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONFAULTHANDLER: "1"
        run: |
          set -euo pipefail
          MODE="${{ steps.scan_mode.outputs.mode }}"
          python -u scan.py "$MODE" 2>&1 | tee scanner-run.log

      - name: Commit and push updated data
        id: git_push
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "Live Signal Scanner"
          git config user.email "scanner@users.noreply.github.com"

          git add data reports state

          if git diff --cached --quiet; then
            echo "No updated output found."
          else
            git commit -m "Auto update: ${{ steps.scan_mode.outputs.mode }} [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]"
          fi

          git restore --worktree -- working || true
          rm -f working/pipeline-checkpoint.json
          rm -rf working/source-cache working/checkpoints
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete

          REMAINING="$(git status --porcelain --untracked-files=normal)"
          if [[ -n "$REMAINING" ]]; then
            echo "Unexpected changes remain:"
            echo "$REMAINING"
            exit 1
          fi

          git fetch origin main
          git rebase origin/main

          for ATTEMPT in 1 2 3; do
            if git push origin HEAD:main; then
              break
            fi
            if [[ "$ATTEMPT" == "3" ]]; then
              echo "GitHub push failed after 3 attempts."
              exit 1
            fi
            sleep 5
            git fetch origin main
            git rebase origin/main
          done

          COMMIT="$(git rev-parse --short HEAD)"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "GitHub push successful: $COMMIT"

      - name: Send Telegram after successful GitHub push
        if: success()
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -u scanner/telegram_notify.py \
            "${{ steps.scan_mode.outputs.mode }}" \
            "${{ steps.git_push.outputs.commit }}" \
            "main"

      - name: Upload scanner log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-failure-log-${{ github.run_number }}
          path: scanner-run.log
          if-no-files-found: ignore
          retention-days: 3
