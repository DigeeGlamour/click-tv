name: Live Signal Scanner

on:
  schedule:
    # Today Match: প্রতি ১৫ মিনিট; rotating links/status স্বয়ংক্রিয়ভাবে refresh হয়।
    - cron: "2,17,32,47 * * * *"
      timezone: "Asia/Dhaka"

    # Upcoming Match: প্রতি ৩০ মিনিট; schedule/link changes দ্রুত publish হয়।
    - cron: "9,39 * * * *"
      timezone: "Asia/Dhaka"

    # TV Channels: প্রতি ৬ ঘণ্টা
    - cron: "17 0,6,12,18 * * *"
      timezone: "Asia/Dhaka"

    # Movies: প্রতি দ্বিতীয় calendar date ভোর ৪:৩৭
    - cron: "37 4 */2 * *"
      timezone: "Asia/Dhaka"

  workflow_dispatch:
    inputs:
      mode:
        description: "Select Scan Mode"
        required: true
        default: "channels"
        type: choice
        options:
          - channels
          - today
          - upcoming
          - movies
          - all

permissions:
  contents: write

concurrency:
  # v2 rotates away from the orphaned v1 queue while preserving one-writer safety.
  group: live-signal-data-writer-v2
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    # Exhaustive mode verifies every unique playback configuration. Large
    # movie catalogues can legitimately take longer than the old 55-minute cap.
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Mask scanner secrets in all following logs
        shell: bash
        env:
          PRIVATE_MOVIE_SOURCE_TOKEN: ${{ secrets.PRIVATE_MOVIE_SOURCE_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          for VALUE in \
            "$PRIVATE_MOVIE_SOURCE_TOKEN" \
            "$TMDB_API_KEY" \
            "$TMDB_API_TOKEN" \
            "$TELEGRAM_BOT_TOKEN" \
            "$TELEGRAM_CHAT_ID"; do
            if [[ -n "$VALUE" ]]; then
              echo "::add-mask::$VALUE"
            fi
          done

      - name: Restore scanner source cache
        uses: actions/cache@v6
        with:
          path: working/source-cache
          key: live-signal-source-cache-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            live-signal-source-cache-${{ runner.os }}-${{ github.ref_name }}-
            live-signal-source-cache-${{ runner.os }}-

      - name: Validate scanner files
        shell: bash
        run: |
          set -euo pipefail

          test -f scan.py
          test -f config/settings.json
          test -f config/sources.json
          test -f config/event-fixtures.json
          test -f scanner/content_router.py
          test -f scanner/channel_logos.py
          test -f scanner/fast_pipeline.py
          test -f scanner/source_loader.py
          test -f scanner/normalizer.py
          test -f scanner/planner.py
          test -f scanner/verifier.py
          test -f scanner/bd_verifier.py
          test -f scanner/channels.py
          test -f scanner/movies.py
          test -f scanner/series.py
          test -f manual/movies.txt
          test -f manual/movies.json
          test -f manual/channel-logos.json
          test -f manual/movie-sources.json
          test -f manual/movies-template.txt
          test -f manual/movies-template.json
          test -f state/manual-movie-posters.json
          test -f state/manual-movie-remote-cache.json
          test -f state/channel-logo-cache.json
          test -f tests/test_manual_movies.py
          test -f tests/test_manual_movie_sources.py
          test -f tests/test_series_pipeline.py
          test -f tests/test_final_design_contract.py
          test -f tests/test_channel_logos.py
          test -f tests/test_schedule_resolver.py
          test -f scanner/events.py
          test -f scanner/schedule_resolver.py
          test -f scanner/output.py
          test -f scanner/playback_profiles.py
          test -f scanner/telegram_notify.py
          test -f site/index.html
          test -f site/assets/css/final-design.css
          test -f site/assets/js/app.js
          test -f site/assets/js/series.js
          test -f data/playback-sources.json
          test -f .gitattributes

          python - <<'PY'
          from pathlib import Path

          bad = [
              path.as_posix()
              for path in Path(".").rglob("*.sh")
              if ".git" not in path.parts and b"\r" in path.read_bytes()
          ]
          if bad:
              raise SystemExit("Shell scripts must use LF line endings: " + ", ".join(bad))
          PY

          python -m py_compile scan.py scanner/*.py scanner/parsers/*.py scripts/*.py tests/*.py
          node --check site/assets/js/app.js
          node --check site/assets/js/series.js
          node --check site/sw.js
          node tests/playback-worker-runtime.mjs
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Select scan mode
        id: scan_mode
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MODE="${{ inputs.mode }}"
          elif [[ "${{ github.event.schedule }}" == "2,17,32,47 * * * *" ]]; then
            MODE="today"
          elif [[ "${{ github.event.schedule }}" == "9,39 * * * *" ]]; then
            MODE="upcoming"
          elif [[ "${{ github.event.schedule }}" == "17 0,6,12,18 * * *" ]]; then
            MODE="channels"
          elif [[ "${{ github.event.schedule }}" == "37 4 */2 * *" ]]; then
            MODE="movies"
          else
            MODE="channels"
          fi

          echo "Selected scan mode: $MODE"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Checkout private movie source repository
        if: steps.scan_mode.outputs.mode == 'movies' || steps.scan_mode.outputs.mode == 'all'
        uses: actions/checkout@v7
        with:
          repository: 0matbank/hopeful-research
          ref: main
          path: working/private-movie-source
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.PRIVATE_MOVIE_SOURCE_TOKEN }}

      - name: Validate private movie source repository
        if: steps.scan_mode.outputs.mode == 'movies' || steps.scan_mode.outputs.mode == 'all'
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_ROOT="working/private-movie-source/categories"
          test -d "$SOURCE_ROOT"

          FILE_COUNT="$(find "$SOURCE_ROOT" -type f \
            -iname '*.txt' \
            ! -iname 'history.txt' \
            ! -iname 'readme.txt' \
            ! -name '.*' \
            ! -name '_*' | wc -l | tr -d ' ')"

          if [[ "$FILE_COUNT" -lt 1 ]]; then
            echo "No supported movie source files found under $SOURCE_ROOT"
            exit 1
          fi

          echo "Dynamic movie source discovery found $FILE_COUNT supported file(s)."
          find "$SOURCE_ROOT" -type f \
            -iname '*.txt' \
            ! -iname 'history.txt' \
            ! -iname 'readme.txt' \
            ! -name '.*' \
            ! -name '_*' | sort

      - name: Run scanner
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONFAULTHANDLER: "1"
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
          PRIVATE_MOVIE_SOURCE_TOKEN: ${{ secrets.PRIVATE_MOVIE_SOURCE_TOKEN }}
        run: |
          set -euo pipefail

          MODE="${{ steps.scan_mode.outputs.mode }}"

          echo "============================================================"
          echo "LIVE SIGNAL SCANNER STARTED"
          echo "Mode: $MODE"
          echo "Commit: $(git rev-parse --short HEAD)"
          echo "Started: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          python --version
          echo "============================================================"

          python -u scan.py "$MODE" 2>&1 | tee scanner-run.log

          echo "============================================================"
          echo "SCANNER FINISHED"
          echo "Mode: $MODE"
          echo "Finished: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "============================================================"

      - name: Validate generated Cloudflare Pages output
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-pages.sh

      - name: Commit and push updated data
        id: git_push
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "Live Signal Scanner"
          git config user.email "scanner@users.noreply.github.com"

          git add data reports state

          if git diff --cached --quiet; then
            echo "No updated output found."
          else
            git commit -m "Auto update: ${{ steps.scan_mode.outputs.mode }} [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]"
          fi

          # Generated output is safely stored in the commit above. Remove every
          # uncommitted scanner/test mutation before rebase; the commit remains.
          git restore --staged --worktree -- .

          # Untracked temporary checkpoint পরিষ্কার করা হবে।
          rm -f working/pipeline-checkpoint.json
          rm -f working/scan-progress.json
          rm -rf working/checkpoints

          # source-cache delete করা হবে না।
          # .gitignore এটিকে Git থেকে বাদ রাখবে এবং Actions cache সংরক্ষণ করবে।

          # __pycache__/pyc .gitignore-এ আছে। এগুলো delete করলে পুরোনো
          # repository-তে ভুল করে tracked থাকা cache D status তৈরি করত।

          REMAINING="$(git status --porcelain --untracked-files=normal)"

          if [[ -n "$REMAINING" ]]; then
            echo "Unexpected changes remain:"
            echo "$REMAINING"
            exit 1
          fi

          git fetch origin main
          git rebase origin/main

          for ATTEMPT in 1 2 3; do
            if git push origin HEAD:main; then
              break
            fi

            if [[ "$ATTEMPT" == "3" ]]; then
              echo "GitHub push failed after 3 attempts."
              exit 1
            fi

            echo "Push attempt $ATTEMPT failed. Retrying..."
            sleep 5
            git fetch origin main
            git rebase origin/main
          done

          COMMIT="$(git rev-parse --short HEAD)"

          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "GitHub push successful: $COMMIT"

      - name: Send Telegram after successful GitHub push
        if: success()
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -u scanner/telegram_notify.py \
            "${{ steps.scan_mode.outputs.mode }}" \
            "${{ steps.git_push.outputs.commit }}" \
            "main"

      - name: Send Telegram after failed scan or push
        if: failure()
        continue-on-error: true
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MODE="${{ steps.scan_mode.outputs.mode }}"
          if [[ -z "$MODE" ]]; then MODE="unknown"; fi
          python -u scanner/telegram_notify.py \
            "$MODE" \
            "${{ github.sha }}" \
            "${{ github.ref_name }}" \
            --failure \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Upload scanner log on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: scanner-failure-log-${{ github.run_number }}
          path: scanner-run.log
          if-no-files-found: ignore
          retention-days: 3
