name: Click TV Site Check

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: click-tv-site-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-site:
    name: Validate Click TV
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install project requirements
        run: |
          if [ -s requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

          python -m pip install pytest

      - name: Show repository structure
        run: |
          echo "Repository root:"
          find . -maxdepth 3 -type f \
            ! -path "./.git/*" \
            | sort

      - name: Check required source files
        shell: bash
        run: |
          set -Eeuo pipefail

          required_files=(
            "scan.py"
            "requirements.txt"
            "site/index.html"
            "site/runtime-config.json"
            "site/app.webmanifest"
            "site/sw.js"
            "site/_headers"
            "scripts/build-pages.sh"
            "scripts/validate-pages.py"
            "data/manifest.json"
            "data/today-match.json"
            "data/upcoming.json"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error file=$file::Required file পাওয়া যায়নি"
              exit 1
            fi

            if [ ! -s "$file" ]; then
              echo "::error file=$file::Required file empty"
              exit 1
            fi
          done

          echo "All required source files are present."

      - name: Validate JSON syntax
        shell: bash
        run: |
          set -Eeuo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          json_files = [
              Path("site/runtime-config.json"),
              Path("site/app.webmanifest"),
              Path("data/manifest.json"),
              Path("data/today-match.json"),
              Path("data/upcoming.json"),
          ]

          json_files.extend(
              sorted(Path("data/channels").glob("*.json"))
          )

          json_files.extend(
              sorted(Path("data/movies").glob("*/index.json"))
          )

          json_files.extend(
              sorted(Path("data/movies").glob("*/page-*.json"))
          )

          failed = False

          for path in json_files:
              try:
                  with path.open(
                      "r",
                      encoding="utf-8",
                  ) as file:
                      json.load(file)

                  print(f"[OK] {path}")

              except Exception as error:
                  failed = True
                  print(f"::error file={path}::{error}")

          if failed:
              raise SystemExit(1)

          print(
              f"Validated {len(json_files)} JSON files."
          )
          PY

      - name: Compile Python files
        run: |
          python -m compileall \
            -q \
            scan.py \
            scanner \
            tests \
            scripts/validate-pages.py

      - name: Run scanner tests
        run: |
          python -m pytest -q

      - name: Build Cloudflare Pages output
        shell: bash
        run: |
          set -Eeuo pipefail

          chmod +x scripts/build-pages.sh
          bash scripts/build-pages.sh

      - name: Check generated dist structure
        shell: bash
        run: |
          set -Eeuo pipefail

          required_dist_files=(
            "dist/index.html"
            "dist/runtime-config.json"
            "dist/app.webmanifest"
            "dist/sw.js"
            "dist/_headers"
            "dist/data/manifest.json"
            "dist/data/today-match.json"
            "dist/data/upcoming.json"
          )

          for file in "${required_dist_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error file=$file::Build output file পাওয়া যায়নি"
              exit 1
            fi

            if [ ! -s "$file" ]; then
              echo "::error file=$file::Build output file empty"
              exit 1
            fi
          done

          echo "Generated dist structure is complete."

      - name: Check public build safety
        shell: bash
        run: |
          set -Eeuo pipefail

          forbidden_directories=(
            ".github"
            "config"
            "manual"
            "reports"
            "scanner"
            "state"
            "tests"
            "working"
            "workers"
          )

          for directory in "${forbidden_directories[@]}"; do
            if [ -d "dist/$directory" ]; then
              echo "::error::Private folder found in dist: $directory/"
              exit 1
            fi
          done

          forbidden_files=(
            ".env"
            ".dev.vars"
            "requirements.txt"
            "scan.py"
            "wrangler.toml"
          )

          for file_name in "${forbidden_files[@]}"; do
            if find dist -type f -name "$file_name" | grep -q .; then
              echo "::error::Private file found in dist: $file_name"
              exit 1
            fi
          done

          if find dist -type f \
            \( \
              -name "*.py" \
              -o -name "*.pyc" \
              -o -name "*.pem" \
              -o -name "*.p12" \
              -o -name "*.pfx" \
            \) \
            | grep -q .; then
            echo "::error::Private source or secret file found in dist"
            exit 1
          fi

          echo "Public build safety check passed."

      - name: Run final Pages validator
        run: |
          python scripts/validate-pages.py dist

      - name: Show final build summary
        shell: bash
        run: |
          echo "Final dist files:"
          find dist -type f | sort

          echo
          echo "Total files:"
          find dist -type f | wc -l

          echo
          echo "Total build size:"
          du -sh dist

      - name: Upload Pages build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: click-tv-pages-dist
          path: dist
          if-no-files-found: error
          retention-days: 7
