# The Worker that already holds the GITHUB_DISPATCH_TOKEN secret, created in
# the Cloudflare dashboard on 2026-09-06 at 07:30Z. The name has to match it
# exactly: a secret belongs to one Worker, it cannot be read back out, and
# deploying under any other name creates a second Worker with the code and
# the cron but no token - which is what happened once and is why this line
# is now a decision rather than a default. It also matches this directory.
name = "scan-trigger"
main = "src/index.js"
compatibility_date = "2026-09-06"

# Nothing about this Worker is reachable from the internet. It has no `fetch`
# handler and no route, and workers_dev is off so no *.workers.dev URL is
# published for it. Its only entry point is the cron below.
workers_dev = false

# workers_dev is not the whole story. A deploy that leaves `preview_urls`
# unset turns it ON - the 2026-09-06 deploy printed `preview_urls: false ->
# true` and published a *.workers.dev preview host for a Worker whose whole
# design note says nothing about it is reachable from the internet. It is
# written down here so the next deploy cannot re-enable it by omission.
preview_urls = false

# The repository's own declared cadences, minute for minute, copied from
# .github/workflows/scan.yml. Firing on the same minutes is deliberate: when
# GitHub also delivers its native trigger, the two land in the SAME concurrency
# group, because scan.yml computes the group from `inputs.mode` as well as
# `github.event.schedule`. Offsetting them would double the scan rate, which is
# a cadence nobody chose.
#
#   "3,23,43 * * * *"  -> today              live-signal-events-v4
#                                            cancel-in-progress false: the two
#                                            runs stack, one waits, neither is
#                                            interrupted mid-write
#   "1-59/5 * * * *"   -> upcoming-targeted  live-signal-targeted-v1
#                                            cancel-in-progress true: the newer
#                                            link hunt replaces the older one,
#                                            which is what targeted has always
#                                            done for its native cron
#
# Both were run against GitHub's native schedule alone for months; the external
# trigger changes who presses the button, not what the button does.
#
# EVERY cron here must also be a key of SCHEDULES in src/index.js, and every
# key there must be a cron here. A trigger with no entry dispatches nothing -
# deliberately, because a scheduler that guesses a mode writes the wrong data.
# tests/scan-trigger-worker-runtime.mjs fails if the two lists ever disagree.
[triggers]
crons = ["3,23,43 * * * *", "1-59/5 * * * *"]

# No [vars] block. Everything this Worker needs is a secret, and a secret set
# with `wrangler secret put` is never written to this file:
#
#   wrangler secret put GITHUB_DISPATCH_TOKEN   (required)
#   wrangler secret put TELEGRAM_BOT_TOKEN      (optional, for the silence alert)
#   wrangler secret put TELEGRAM_CHAT_ID        (optional, same)
#
# GITHUB_DISPATCH_TOKEN must be a fine-grained personal access token scoped to
# DigeeGlamour/click-tv alone, with exactly:
#
#   Actions    Read and write     <- required by the dispatches endpoint
#   Metadata   Read               <- mandatory, granted automatically
#
# and nothing else. In particular it does NOT need Contents: the workflow's own
# GITHUB_TOKEN does the committing under the `permissions: contents: write` the
# workflow already declares.

# No kv_namespaces. No d1_databases. No durable_objects. No queues.
# This Worker stores nothing, and is not a control plane.
