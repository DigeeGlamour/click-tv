name = "click-tv-playback-telemetry"
main = "src/index.js"
compatibility_date = "2026-08-01"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://clicktv.pages.dev"

# Create a KV namespace in Cloudflare and replace the placeholder ID.
[[kv_namespaces]]
binding = "PLAYBACK_REPORTS"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# Add this as an encrypted secret in Cloudflare Dashboard:
# EXPORT_TOKEN
